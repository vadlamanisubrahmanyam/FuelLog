name: Build FuelLog APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Align Expo package versions
        run: npx expo install --fix
      - name: Bump versionCode (enables in-place upgrade)
        run: python3 ../.github/scripts/set_version.py app.json
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Patch Gradle (RN compat)
        run: python3 ../.github/scripts/patch_gradle.py android/app/build.gradle
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FuelLog.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FuelLog-apk
          path: app/FuelLog.apk
      - name: Publish release (download link for phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FuelLog 1.0.${{ github.run_number }}
          files: app/FuelLog.apk
